name: Engine Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verificar dependencias enlazadas
        run: bash .github/scripts/check-linked-dependencies.sh
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - name: Verificar un plugin binario de Allay sin recompilarlo para Engine
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/smoke-legacy-plugin.sh

      - name: Guardar resultados de pruebas para diagnóstico
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-test-reports-${{ github.sha }}
          path: |
            server/build/test-results/test/**
            server/build/reports/tests/test/**
          if-no-files-found: ignore

      - name: Upload built JARs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: engine-server-${{ github.sha }}
          path: server/build/libs/*.jar
          if-no-files-found: error
