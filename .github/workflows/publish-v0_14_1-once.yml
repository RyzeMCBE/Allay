name: Publicar versión oficial 0.14.1 (única vez)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0_14_1-once.yml'

permissions:
  contents: write

jobs:
  publish:
    name: Validar, compilar y publicar v0.14.1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar Allay y sus dos submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar la versión oficial y que aún no esté publicada
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$(sed -n 's/^server.version=//p' gradle.properties)" != '0.14.1' ]]; then
            echo "::error::server.version debe ser 0.14.1."
            exit 1
          fi
          git fetch origin main
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::main avanzó. No se publica una revisión desactualizada."
            exit 1
          fi
          if git ls-remote --exit-code origin refs/tags/v0.14.1 >/dev/null 2>&1; then
            echo "::error::Ya existe el tag v0.14.1. No se sobrescribe."
            exit 1
          fi
          if gh release view v0.14.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Ya existe el release v0.14.1. No se sobrescribe."
            exit 1
          fi

      - name: Compilar y ejecutar todas las pruebas para la versión estable
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build :server:shadowJar --no-daemon \
            -Pserver.version=0.14.1 -Pallay.is-dev-build=false

      - name: Preparar JAR oficial y verificación SHA256
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find server/build/libs -maxdepth 1 -type f -name 'allay-server-0.14.1-*-shaded.jar' | sort)
          if (( ${#jars[@]} != 1 )); then
            echo "::error::Se esperaba exactamente un JAR ejecutable de la versión 0.14.1."
            exit 1
          fi
          mkdir -p dist
          cp "${jars[0]}" dist/Allay-0.14.1.jar
          (
            cd dist
            sha256sum Allay-0.14.1.jar > Allay-0.14.1.jar.sha256
            sha256sum --check Allay-0.14.1.jar.sha256
          )
          test -s dist/Allay-0.14.1.jar

      - name: Conservar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-allay-0.14.1
          path: |
            server/build/test-results/test/**
            server/build/reports/tests/test/**
          if-no-files-found: ignore

      - name: Guardar JAR oficial en Actions
        uses: actions/upload-artifact@v4
        with:
          name: allay-0.14.1-oficial
          path: |
            dist/Allay-0.14.1.jar
            dist/Allay-0.14.1.jar.sha256
          if-no-files-found: error

      - name: Crear tag y GitHub Release oficial con el JAR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          gh release create v0.14.1 \
            dist/Allay-0.14.1.jar \
            dist/Allay-0.14.1.jar.sha256 \
            --target "$GITHUB_SHA" \
            --title 'RyzeMCBE Allay 0.14.1' \
            --generate-notes \
            --latest
