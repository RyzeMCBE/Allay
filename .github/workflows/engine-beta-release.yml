name: Engine · Public beta (Linux and Developer SDK)

on:
  push:
    tags:
      - 'engine-v*-beta.*'

permissions:
  contents: write

concurrency:
  group: engine-public-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta:
    if: github.ref_type == 'tag'
    name: Test, package and publish Engine beta
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Fetch exact tagged sources and pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate tag and integration branch
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^engine-v([0-9]+\.[0-9]+\.[0-9]+)-beta\.([1-9][0-9]*)$ ]]; then
            echo "::error::Expected engine-vX.Y.Z-beta.N tag"
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          if [[ "$(sed -n 's/^server.version=//p' gradle.properties)" != "$base" ]]; then
            echo "::error::Beta tag must match server.version"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin feat/engine-1.26.60
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Tag must point to a commit from the Engine 1.26.60 integration branch."
            exit 1
          fi
          echo "ENGINE_BETA_VERSION=${tag#engine-v}" >> "$GITHUB_ENV"

      - name: Check pinned Protocol and StateUpdater revisions
        run: bash .github/scripts/check-linked-dependencies.sh

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build server and developer API and run tests
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean build :server:shadowJar :api:generatePomFileForRyzeApiPublication \
            -Pserver.version="$ENGINE_BETA_VERSION" \
            -Pryzemcbe.apiVersion="0.30.0-engine-beta.${ENGINE_BETA_VERSION##*.}" \
            -Pallay.is-dev-build=true --no-daemon

      - name: Verify binary compatibility with previously compiled Allay plugin
        shell: bash
        run: bash .github/scripts/smoke-legacy-plugin.sh

      - name: Package server, SDK, source code and checksums
        shell: bash
        run: bash .github/scripts/package-engine-beta.sh "$GITHUB_REF_NAME"

      - name: Upload beta assets to Actions
        uses: actions/upload-artifact@v7
        with:
          name: engine-beta-${{ github.ref_name }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

      - name: Publish or complete GitHub beta prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="$ENGINE_BETA_VERSION"
          assets=(dist/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" != "true" ]]; then
              echo "::error::Existing release is not a prerelease; refusing to modify it."
              exit 1
            fi
            mapfile -t uploaded < <(gh release view "$tag" --json assets --jq '.assets[].name')
            for asset in "${assets[@]}"; do
              name="${asset##*/}"
              if printf '%s\n' "${uploaded[@]}" | grep -Fxq "$name"; then
                echo "Keeping existing beta asset: $name"
              else
                gh release upload "$tag" "$asset"
              fi
            done
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Engine $version · Minecraft Bedrock 1.26.60 (Beta)" \
              --notes-file "docs/releases/$tag.md"
          fi
