name: Repair missing Allay v0.14.2 release files (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v0.14.2-assets.yml'

permissions:
  contents: write
  actions: read

jobs:
  restore-release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.14.2
      EXPECTED_TAG_COMMIT: 907a724022e85fcf81b7bd088372ab4f0b7f5da5
      SOURCE_RUN_ID: '38672346320'
      SOURCE_ARTIFACT: allay-0.14.2-907a724022e85fcf81b7bd088372ab4f0b7f5da5

    steps:
      - name: Confirm existing release and exact original tag
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$EXPECTED_TAG_COMMIT" ]]; then
            echo "::error::Release tag unexpectedly changed from tested commit."
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null

      - name: Restore original built JAR and SHA-256 from successful build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name "$SOURCE_ARTIFACT" --dir dist
          test -s "dist/Allay-0.14.2.jar"
          test -s "dist/Allay-0.14.2.jar.sha256"
          (
            cd dist
            sha256sum -c Allay-0.14.2.jar.sha256
          )
          unzip -tqq dist/Allay-0.14.2.jar

      - name: Upload missing files without overwriting existing release assets
        shell: bash
        run: |
          set -euo pipefail
          for name in Allay-0.14.2.jar Allay-0.14.2.jar.sha256; do
            if gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Already published: $name (left untouched)"
            else
              gh release upload "$RELEASE_TAG" "dist/$name" --repo "$GH_REPO"
              echo "Published: $name"
            fi
          done

      - name: Verify both files are visible in GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t uploaded < <(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')
          for name in Allay-0.14.2.jar Allay-0.14.2.jar.sha256; do
            printf '%s\n' "${uploaded[@]}" | grep -Fxq "$name" || {
              echo "::error::Missing release file: $name"
              exit 1
            }
          done
          echo "Both release assets are published; release description and tag unchanged."
