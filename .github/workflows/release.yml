name: Allay · Beta y versión oficial

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Versión oficial, revisión o beta (v0.14.3, v0.14.3.1 o v0.14.3-beta.1)'
        required: true
        default: 'v0.14.3.1'
        type: string
      publish_existing_release:
        description: 'Completar un release existente con JAR y SHA-256 sin sobrescribir archivos'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: allay-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Compilar, probar y generar JAR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}
      REPAIR_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing_release || false }}

    steps:
      - name: Descargar código con Protocol y StateUpdater
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing_release && inputs.version_tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Verificar dependencias enlazadas
        run: bash .github/scripts/check-linked-dependencies.sh

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validar tag, versión y rama
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\.[1-9][0-9]*)?(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Usa vX.Y.Z, vX.Y.Z.N o sus variantes -beta.N (N >= 1)."
            exit 1
          fi

          series="${BASH_REMATCH[1]}"
          version="${tag#v}"
          base="${version%%-beta.*}"
          configured="$(sed -n 's/^server.version=//p' gradle.properties | tr -d '\r')"
          if [[ "$base" != "$configured" && "$series" != "$configured" ]]; then
            echo "::error::El tag requiere server.version=$base, pero se encontró $configured."
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$REPAIR_EXISTING" == "true" ]]; then
            git fetch origin main --tags
            tagged_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [[ "$source_sha" != "$tagged_sha" ]]; then
              echo "::error::La revisión compilada debe ser exactamente la del tag $tag."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$source_sha" FETCH_HEAD; then
              echo "::error::El tag debe apuntar a un commit integrado en main."
              exit 1
            fi
          fi
          echo "RELEASE_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

          if [[ "$version" == *-beta.* ]]; then
            channel=beta
          else
            channel=stable
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Compilar y ejecutar pruebas
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean build :server:shadowJar --no-daemon \
            -Pserver.version="$RELEASE_VERSION" \
            -Pallay.is-dev-build=false

      - name: Preparar JAR y SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find server/build/libs -maxdepth 1 -type f \
            -name 'allay-server-*-shaded.jar' | sort)
          if (( ${#jars[@]} != 1 )); then
            echo "::error::Se esperaba exactamente un JAR ejecutable."
            exit 1
          fi

          jar="${jars[0]}"
          prefix="allay-server-${RELEASE_VERSION}-"
          if [[ "${jar##*/}" != "$prefix"*"-shaded.jar" ]]; then
            echo "::error::El JAR no contiene la versión $RELEASE_VERSION: ${jar##*/}"
            exit 1
          fi

          mkdir -p dist
          cp "$jar" "dist/Allay-${RELEASE_VERSION}.jar"
          (
            cd dist
            sha256sum "Allay-${RELEASE_VERSION}.jar" > "Allay-${RELEASE_VERSION}.jar.sha256"
            sha256sum -c "Allay-${RELEASE_VERSION}.jar.sha256"
          )

      - name: Conservar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allay-tests-${{ env.RELEASE_SOURCE_SHA }}
          path: |
            server/build/test-results/test/**
            server/build/reports/tests/test/**
          if-no-files-found: ignore

      - name: Adjuntar JAR al workflow
        uses: actions/upload-artifact@v7
        with:
          name: allay-${{ env.RELEASE_VERSION }}-${{ env.RELEASE_SOURCE_SHA }}
          path: |
            dist/Allay-*.jar
            dist/Allay-*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Crear o completar GitHub Release con el JAR
        if: github.event_name == 'push' || inputs.publish_existing_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=("Allay-${RELEASE_VERSION}.jar" "Allay-${RELEASE_VERSION}.jar.sha256")

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "El release $RELEASE_TAG ya existe. Se conservarán su descripción y los archivos publicados."
            mapfile -t uploaded < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for asset in "${assets[@]}"; do
              if printf '%s\n' "${uploaded[@]}" | grep -Fxq "$asset"; then
                echo "Ya existe $asset; no se modifica."
                continue
              fi
              gh release upload "$RELEASE_TAG" "dist/$asset"
              echo "Archivo adjuntado: $asset"
            done
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "::error::La recuperación manual solo completa releases existentes; no crea etiquetas ni releases nuevos."
            exit 1
          fi

          args=(--verify-tag --target "$RELEASE_SOURCE_SHA" \
            --title "RyzeMCBE Allay $RELEASE_VERSION")
          notes_file="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$notes_file" ]]; then
            args+=(--notes-file "$notes_file")
          else
            args+=(--generate-notes)
          fi
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            "dist/${assets[0]}" \
            "dist/${assets[1]}" \
            "${args[@]}"
