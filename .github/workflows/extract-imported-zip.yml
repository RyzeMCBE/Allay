name: Extract imported Allay source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-imported-zip.yml

permissions:
  contents: write

concurrency:
  group: extract-allay-import
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate archive and unpack source
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import stat
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("Allay-master.zip")
          if not archive.is_file():
              raise SystemExit("ERROR: Allay-master.zip not found; nothing was changed.")
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f"ERROR: Corrupt ZIP member {bad}")
              members = [i for i in zf.infolist() if not i.is_dir()]
              if not members or len(members) > 30000:
                  raise SystemExit(f"ERROR: Unexpected file count: {len(members)}")
              if sum(i.file_size for i in members) > 800_000_000:
                  raise SystemExit("ERROR: Archive exceeds safety limit (800 MB).")
              paths = []
              for info in members:
                  name = info.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  if (path.is_absolute() or
                      any(p in ("..", ".", "") for p in path.parts) or
                      any(p == ".git" for p in path.parts) or
                      ":" in path.parts[0] or
                      "\x00" in name):
                      raise SystemExit(f"ERROR: Unsafe ZIP path: {info.filename}")
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"ERROR: Symlinks not allowed: {info.filename}")
                  if info.file_size > 98_000_000:
                      raise SystemExit(f"ERROR: Individual file too large: {info.filename}")
                  paths.append(path)

              first_dirs = {p.parts[0] for p in paths if len(p.parts) > 1}
              flatten = (len(first_dirs) == 1 and
                         all(len(p.parts) > 1 for p in paths))
              trim = next(iter(first_dirs)) if flatten else None
              output_paths = []
              for p in paths:
                  target = PurePosixPath(*p.parts[1:]) if trim else p
                  if str(target) in ("Allay-master.zip", ".github/workflows/extract-imported-zip.yml"):
                      raise SystemExit(f"ERROR: Conflicting path: {target}")
                  output_paths.append(target)
              if len(set(output_paths)) != len(output_paths):
                  raise SystemExit("ERROR: Duplicate paths after flattening.")

              with tempfile.TemporaryDirectory(prefix="allay-import-") as tmp:
                  base = Path(tmp)
                  for info, target in zip(members, output_paths):
                      dest = base.joinpath(*target.parts)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as src, dest.open("wb") as dst:
                          shutil.copyfileobj(src, dst)
                      if info.external_attr >> 16 & 0o111:
                          dest.chmod(0o755)
                  for source in base.rglob("*"):
                      if not source.is_file():
                          continue
                      relative = source.relative_to(base)
                      destination = Path.cwd() / relative
                      if destination.exists():
                          raise SystemExit(f"ERROR: Existing file conflict: {destination}")
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.move(str(source), str(destination))
              print(f"Extracted {len(members)} files" +
                    (f"; stripped top directory {trim}" if trim else "; kept original hierarchy"))
          PY
      - name: Commit extracted source and remove archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- Allay-master.zip
          rm -f .github/workflows/extract-imported-zip.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: unpack Allay source and remove ZIP archive"
          git push origin HEAD:main
